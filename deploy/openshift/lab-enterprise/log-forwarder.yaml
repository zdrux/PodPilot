apiVersion: v1
kind: ServiceAccount
metadata:
  name: podpilot-eval-collector
  namespace: openshift-logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: podpilot-eval-collect-application
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: collect-application-logs}
subjects:
  - {kind: ServiceAccount, name: podpilot-eval-collector, namespace: openshift-logging}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: podpilot-eval-write-logs
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: logging-collector-logs-writer}
subjects:
  - {kind: ServiceAccount, name: podpilot-eval-collector, namespace: openshift-logging}
---
apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: podpilot-eval
  namespace: openshift-logging
spec:
  serviceAccount: {name: podpilot-eval-collector}
  inputs:
    - name: eval-applications
      type: application
      application:
        includes:
          - {namespace: 'podpilot-eval-*'}
  outputs:
    - name: loki
      type: lokiStack
      lokiStack:
        target: {name: logging-loki, namespace: openshift-logging}
        authentication:
          token: {from: serviceAccount}
      tls:
        ca:
          configMapName: podpilot-eval-service-ca
          key: service-ca.crt
  pipelines:
    - name: eval-to-loki
      inputRefs: [eval-applications]
      outputRefs: [loki]
