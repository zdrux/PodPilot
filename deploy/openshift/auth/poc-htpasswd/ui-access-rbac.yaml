apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: podpilot-ui-access
  namespace: ai-ops
  labels:
    app.kubernetes.io/name: podpilot
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["podpilot"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["podpilot-role-viewer"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: podpilot-ui-access
  namespace: ai-ops
  labels:
    app.kubernetes.io/name: podpilot
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: podpilot-viewers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: podpilot-ui-access
---
