apiVersion: apps/v1
kind: Deployment
metadata:
  name: podpilot
  namespace: ai-ops
  labels:
    app.kubernetes.io/name: podpilot
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: podpilot
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podpilot
        app.kubernetes.io/component: application
    spec:
      serviceAccountName: podpilot-investigator
      # The runner must not inherit the Pod service-account credential. Only the
      # API broker and OAuth proxy receive an explicit projected token mount.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: podpilot:latest
          imagePullPolicy: Always
          command: ["python", "-m", "alembic"]
          args: ["-c", "apps/api/alembic.ini", "upgrade", "head"]
          env: &podpilot-env
            - name: PODPILOT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: environment
            - name: PODPILOT_CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: cluster_name
            - name: PODPILOT_ADHOC_INVENTORY_MAX_OBJECTS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: adhoc_inventory_max_objects
            - name: PODPILOT_ADHOC_MAX_PAYLOAD_BYTES
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: adhoc_max_payload_bytes
            - name: PODPILOT_ADHOC_SEARCH_MAX_SCAN_OBJECTS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: adhoc_search_max_scan_objects
            - name: PODPILOT_ADHOC_METRICS_MAX_RANGE_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: adhoc_metrics_max_range_seconds
            - name: PODPILOT_ADHOC_METRICS_MAX_POINTS_PER_SERIES
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: adhoc_metrics_max_points_per_series
            - name: PODPILOT_ADHOC_METRICS_MAX_RESPONSE_BYTES
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: adhoc_metrics_max_response_bytes
            - name: PODPILOT_ADHOC_LOGS_MAX_RANGE_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: adhoc_logs_max_range_seconds
            - name: PODPILOT_ADHOC_AUDIT_INITIAL_RANGE_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: adhoc_audit_initial_range_seconds
            - name: PODPILOT_ADHOC_AUDIT_MAX_RANGE_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: adhoc_audit_max_range_seconds
            - name: PODPILOT_ADHOC_AUDIT_DEFAULT_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: adhoc_audit_default_limit
            - name: PODPILOT_ADHOC_AUDIT_MAX_RESPONSE_BYTES
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: adhoc_audit_max_response_bytes
            - name: PODPILOT_LOKI_URL
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: loki_url
            - name: PODPILOT_LOKI_ROUTE_NAME
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: loki_route_name
            - name: PODPILOT_LOKI_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: loki_timeout_seconds
            - name: PODPILOT_LOKI_MAX_SERIES
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: loki_max_series
            - name: PODPILOT_ADHOC_MAX_ROUNDS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: adhoc_max_rounds
            - name: PODPILOT_ADHOC_MAX_READS_PER_TURN
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: adhoc_max_reads_per_turn
            - name: PODPILOT_ADHOC_FOLLOWUP_RESERVE_UNITS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: adhoc_followup_reserve_units
            - name: PODPILOT_ADHOC_WORKER_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: adhoc_worker_concurrency
            - name: PODPILOT_ADHOC_MAX_CONCURRENT_RUNS_PER_USER
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: adhoc_max_concurrent_runs_per_user
            - name: PODPILOT_ADHOC_HTTP_PROBE_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: adhoc_http_probe_timeout_seconds
            - name: PODPILOT_ADHOC_HTTP_PROBE_MAX_BYTES
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: adhoc_http_probe_max_bytes
            - name: PODPILOT_ADHOC_RUN_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: adhoc_run_timeout_seconds
            - name: PODPILOT_AGENT_MODE
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: agent_mode
            - name: PODPILOT_DELEGATED_ACCESS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: delegated_access_enabled
            - name: PODPILOT_DELEGATED_SESSION_LIFETIME_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: delegated_session_lifetime_seconds
            - name: PODPILOT_DELEGATED_LOGIN_ATTEMPTS_PER_MINUTE
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: delegated_login_attempts_per_minute
            - name: PODPILOT_AGENT_RUNNER_URL
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: agent_runner_url
            - name: PODPILOT_AGENT_COMMAND_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: agent_command_timeout_seconds
            - name: PODPILOT_AGENT_HEARTBEAT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: agent_heartbeat_seconds
            - name: PODPILOT_REMOTE_CLUSTER_TLS_VERIFY
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: remote_cluster_tls_verify
            - name: PODPILOT_MODEL_TIMEOUT_MAX_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: model_timeout_max_seconds
            - name: PODPILOT_ROLE_INVESTIGATOR_GROUPS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: role_investigator_groups
            - name: PODPILOT_ROLE_APPROVER_GROUPS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: role_approver_groups
            - name: PODPILOT_ROLE_BREAKGLASS_GROUPS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: role_breakglass_groups
            - name: PODPILOT_DATA_DIR
              value: /var/lib/podpilot
            - name: PODPILOT_DATABASE_URL
              value: sqlite:////var/lib/podpilot/podpilot.db
            - name: PODPILOT_AUTH_MODE
              value: proxy
            - name: PODPILOT_MODEL_CREDENTIAL_STORE
              value: kubernetes
            - name: PODPILOT_CLUSTER_CREDENTIAL_STORE
              value: kubernetes
            - name: PODPILOT_POC_MODE
              value: "true"
          securityContext: &restricted-context
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/podpilot
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: podpilot:latest
          imagePullPolicy: Always
          env: *podpilot-env
          ports:
            - name: api-internal
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import urllib.request;
                  urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=2)
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import urllib.request;
                  urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2)
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1500m
              memory: 1Gi
          securityContext: *restricted-context
          volumeMounts:
            - name: data
              mountPath: /var/lib/podpilot
            - name: tmp
              mountPath: /tmp
            - name: podpilot-service-account
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        - name: oauth-proxy
          image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:22fe71990d4e40d2a353116767ce543d0a2e40acd4f068043ae83bc1c2e04f0d
          imagePullPolicy: IfNotPresent
          args:
            - --provider=openshift
            - --openshift-service-account=podpilot-investigator
            - --http-address=0.0.0.0:4180
            - --https-address=
            - --upstream=http://127.0.0.1:8080
            - --upstream-timeout=300s
            - --cookie-secret-file=/etc/oauth-cookie/session_secret
            - --cookie-name=_podpilot_oauth
            - --cookie-refresh=1h
            - --cookie-expire=8h
            - --cookie-samesite=lax
            - --skip-provider-button=true
            - --pass-basic-auth=false
            - --pass-user-headers=true
            - --pass-access-token=false
            - --pass-user-bearer-token=false
            - --scope=user:info user:check-access
            - --openshift-sar={"namespace":"ai-ops","resource":"services","resourceName":"podpilot","verb":"get"}
            - --request-logging=true
          ports:
            - name: oauth
              containerPort: 4180
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /oauth/healthz
              port: oauth
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /oauth/healthz
              port: oauth
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext: *restricted-context
          volumeMounts:
            - name: oauth-cookie
              mountPath: /etc/oauth-cookie
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: podpilot-service-account
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: podpilot-data
        - name: oauth-cookie
          secret:
            secretName: podpilot-oauth-cookie
            defaultMode: 0400
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: podpilot-service-account
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - configMap:
                  name: openshift-service-ca.crt
                  items:
                    - key: service-ca.crt
                      path: service-ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
