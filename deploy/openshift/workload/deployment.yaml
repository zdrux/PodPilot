apiVersion: apps/v1
kind: Deployment
metadata:
  name: podpilot
  namespace: ai-ops
  labels:
    app.kubernetes.io/name: podpilot
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: podpilot
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podpilot
        app.kubernetes.io/component: application
    spec:
      serviceAccountName: podpilot-investigator
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: podpilot:latest
          imagePullPolicy: Always
          command: ["python", "-m", "alembic"]
          args: ["-c", "apps/api/alembic.ini", "upgrade", "head"]
          env: &podpilot-env
            - name: PODPILOT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: environment
            - name: PODPILOT_CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: cluster_name
            - name: PODPILOT_ADHOC_INVENTORY_MAX_OBJECTS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: adhoc_inventory_max_objects
            - name: PODPILOT_ADHOC_RUN_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: adhoc_run_timeout_seconds
            - name: PODPILOT_ROLE_INVESTIGATOR_GROUPS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: role_investigator_groups
            - name: PODPILOT_ROLE_APPROVER_GROUPS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: role_approver_groups
            - name: PODPILOT_ROLE_BREAKGLASS_GROUPS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: role_breakglass_groups
            - name: PODPILOT_DATA_DIR
              value: /var/lib/podpilot
            - name: PODPILOT_DATABASE_URL
              value: sqlite:////var/lib/podpilot/podpilot.db
            - name: PODPILOT_AUTH_MODE
              value: proxy
            - name: PODPILOT_MODEL_CREDENTIAL_STORE
              value: kubernetes
            - name: PODPILOT_POC_MODE
              value: "true"
          securityContext: &restricted-context
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/podpilot
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: podpilot:latest
          imagePullPolicy: Always
          env: *podpilot-env
          ports:
            - name: api-internal
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import urllib.request;
                  urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=2)
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import urllib.request;
                  urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2)
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 768Mi
          securityContext: *restricted-context
          volumeMounts:
            - name: data
              mountPath: /var/lib/podpilot
            - name: tmp
              mountPath: /tmp
        - name: oauth-proxy
          image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:22fe71990d4e40d2a353116767ce543d0a2e40acd4f068043ae83bc1c2e04f0d
          imagePullPolicy: IfNotPresent
          args:
            - --provider=openshift
            - --openshift-service-account=podpilot-investigator
            - --http-address=0.0.0.0:4180
            - --https-address=
            - --upstream=http://127.0.0.1:8080
            - --upstream-timeout=60s
            - --cookie-secret-file=/etc/oauth-cookie/session_secret
            - --cookie-name=_podpilot_oauth
            - --cookie-refresh=1h
            - --cookie-expire=8h
            - --cookie-samesite=lax
            - --skip-provider-button=true
            - --pass-basic-auth=false
            - --pass-user-headers=true
            - --pass-access-token=false
            - --pass-user-bearer-token=false
            - --scope=user:info user:check-access
            - --openshift-sar={"namespace":"ai-ops","resource":"services","resourceName":"podpilot","verb":"get"}
            - --request-logging=true
          ports:
            - name: oauth
              containerPort: 4180
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /oauth/healthz
              port: oauth
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /oauth/healthz
              port: oauth
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext: *restricted-context
          volumeMounts:
            - name: oauth-cookie
              mountPath: /etc/oauth-cookie
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: podpilot-data
        - name: oauth-cookie
          secret:
            secretName: podpilot-oauth-cookie
            defaultMode: 0400
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
