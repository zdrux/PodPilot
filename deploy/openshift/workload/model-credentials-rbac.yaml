apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: podpilot-model-credentials
  namespace: ai-ops
  labels:
    app.kubernetes.io/name: podpilot
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["podpilot-model-credentials"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: podpilot-model-credentials
  namespace: ai-ops
  labels:
    app.kubernetes.io/name: podpilot
subjects:
  - kind: ServiceAccount
    name: ai-observer
    namespace: ai-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: podpilot-model-credentials
