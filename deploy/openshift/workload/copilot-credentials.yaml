apiVersion: v1
kind: Secret
metadata:
  name: podpilot-copilot-credentials
  namespace: ai-ops
  labels:
    app.kubernetes.io/name: podpilot
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: podpilot-copilot-credentials
  namespace: ai-ops
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["podpilot-copilot-credentials"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: podpilot-copilot-credentials
  namespace: ai-ops
subjects:
  - kind: ServiceAccount
    name: podpilot-investigator
    namespace: ai-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: podpilot-copilot-credentials
