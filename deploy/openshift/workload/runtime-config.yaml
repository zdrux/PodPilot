apiVersion: v1
kind: ConfigMap
metadata:
  name: podpilot-runtime
  namespace: ai-ops
  labels:
    app.kubernetes.io/name: podpilot
    app.kubernetes.io/component: configuration
data:
  environment: openshift-poc
  cluster_name: configure-cluster-name
  adhoc_inventory_max_objects: "500"
  adhoc_search_max_scan_objects: "2000"
  adhoc_metrics_max_range_seconds: "2592000"
  adhoc_metrics_max_points_per_series: "300"
  adhoc_metrics_max_response_bytes: "1048576"
  adhoc_logs_max_range_seconds: "86400"
  adhoc_audit_initial_range_seconds: "3600"
  adhoc_audit_max_range_seconds: "86400"
  adhoc_audit_default_limit: "20"
  adhoc_audit_max_response_bytes: "1048576"
  loki_url: "https://logging-loki-gateway-http.openshift-logging.svc:8080/api/logs/v1/application"
  loki_route_name: "logging-loki"
  loki_timeout_seconds: "30"
  loki_max_series: "50"
  adhoc_max_rounds: "10"
  adhoc_max_reads_per_turn: "25"
  adhoc_followup_reserve_units: "0"
  adhoc_worker_concurrency: "3"
  adhoc_max_concurrent_runs_per_user: "2"
  adhoc_http_probe_timeout_seconds: "8"
  adhoc_http_probe_max_bytes: "16384"
  adhoc_run_timeout_seconds: "300"
  agent_mode: "guarded"
  agent_runner_url: "http://127.0.0.1:8090"
  agent_command_timeout_seconds: "300"
  agent_command_max_output_bytes: "262144"
  agent_heartbeat_seconds: "10"
  remote_cluster_tls_verify: "true"
  model_timeout_max_seconds: "240"
  role_investigator_groups: '["podpilot-investigators"]'
  role_approver_groups: '["podpilot-approvers"]'
  role_breakglass_groups: '["podpilot-breakglass"]'
