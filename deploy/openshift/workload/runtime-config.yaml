apiVersion: v1
kind: ConfigMap
metadata:
  name: podpilot-runtime
  namespace: ai-ops
  labels:
    app.kubernetes.io/name: podpilot
    app.kubernetes.io/component: configuration
data:
  environment: openshift-poc
  cluster_name: configure-cluster-name
  adhoc_inventory_max_objects: "500"
  adhoc_search_max_scan_objects: "2000"
  adhoc_metrics_max_range_seconds: "2592000"
  adhoc_metrics_max_points_per_series: "300"
  adhoc_max_rounds: "5"
  adhoc_max_reads_per_turn: "12"
  adhoc_http_probe_timeout_seconds: "8"
  adhoc_http_probe_max_bytes: "16384"
  adhoc_run_timeout_seconds: "180"
  role_investigator_groups: '["podpilot-investigators"]'
  role_approver_groups: '["podpilot-approvers"]'
  role_breakglass_groups: '["podpilot-breakglass"]'
