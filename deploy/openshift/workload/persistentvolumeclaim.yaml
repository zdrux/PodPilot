apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: podpilot-data
  namespace: ai-ops
  labels:
    app.kubernetes.io/name: podpilot
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  # Deliberately omit storageClassName so the cluster's default StorageClass
  # dynamically provisions the volume.
  resources:
    requests:
      storage: 5Gi
