apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: podpilot
  namespace: ai-ops
  labels:
    app.kubernetes.io/name: podpilot
  annotations:
    haproxy.router.openshift.io/timeout: 60s
spec:
  to:
    kind: Service
    name: podpilot
    weight: 100
  port:
    targetPort: oauth
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
