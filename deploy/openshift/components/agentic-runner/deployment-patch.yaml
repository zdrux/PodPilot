apiVersion: apps/v1
kind: Deployment
metadata:
  name: podpilot
  namespace: ai-ops
spec:
  template:
    spec:
      containers:
        - name: oc-runner
          image: podpilot-oc-runner:latest
          imagePullPolicy: Always
          env:
            - name: PODPILOT_AGENT_COMMAND_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: agent_command_timeout_seconds
            - name: PODPILOT_AGENT_HEARTBEAT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: agent_heartbeat_seconds
            - name: PODPILOT_AGENT_COMMAND_MAX_OUTPUT_BYTES
              valueFrom:
                configMapKeyRef:
                  name: podpilot-runtime
                  key: agent_command_max_output_bytes
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import urllib.request;
                  urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import urllib.request;
                  urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
