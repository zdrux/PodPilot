apiVersion: v1
kind: Secret
metadata:
  name: podpilot-incident-credentials
  namespace: ai-ops
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: podpilot-incident-credentials
  namespace: ai-ops
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["podpilot-incident-credentials"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: podpilot-incident-credentials
  namespace: ai-ops
subjects:
  - kind: ServiceAccount
    name: podpilot-investigator
    namespace: ai-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: podpilot-incident-credentials
