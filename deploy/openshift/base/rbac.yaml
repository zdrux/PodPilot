apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: podpilot-investigator
  labels:
    app.kubernetes.io/name: podpilot
subjects:
  - kind: ServiceAccount
    name: podpilot-investigator
    namespace: ai-ops
roleRef:
