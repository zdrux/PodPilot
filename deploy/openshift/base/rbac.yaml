apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: podpilot-alertmanager-api-view
  namespace: openshift-monitoring
  labels:
    app.kubernetes.io/name: podpilot
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["alertmanagers/api"]
    resourceNames: ["main"]
    verbs: ["get", "list"]
