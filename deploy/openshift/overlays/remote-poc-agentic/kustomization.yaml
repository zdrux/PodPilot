apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../remote-poc
  - image-stream.yaml
components:
  - ../../components/agentic-runner
images:
  # Promote the runner with the same immutable version used for the application.
  - name: podpilot-oc-runner
    newName: image-registry.openshift-image-registry.svc:5000/ai-ops/podpilot-oc-runner
    newTag: 0.12.0
patches:
  - path: runtime-config-patch.yaml
