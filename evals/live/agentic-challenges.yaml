apiVersion: v1
kind: Namespace
metadata:
  name: podpilot-test
  labels:
    app.kubernetes.io/part-of: agentic-challenges
---
apiVersion: v1
kind: Namespace
metadata:
  name: podpilot-test2
  labels:
    app.kubernetes.io/part-of: agentic-challenges
---
# Challenge 1: no node has the selected label, leaving the Pod Pending.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-a
  namespace: podpilot-test
  labels:
    app: web-a
    app.kubernetes.io/part-of: agentic-challenges
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-a
  template:
    metadata:
      labels:
        app: web-a
    spec:
      nodeSelector:
        agentic-challenges.invalid/node-pool: nonexistent
      containers:
        - name: httpd
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
# Challenge 2: the referenced PVC is intentionally absent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-b
  namespace: podpilot-test
  labels:
    app: web-b
    app.kubernetes.io/part-of: agentic-challenges
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-b
  template:
    metadata:
      labels:
        app: web-b
    spec:
      containers:
        - name: httpd
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: content
              mountPath: /var/www/html
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: web-content
---
# Challenge 3: the request is deliberately larger than this lab node's capacity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-c
  namespace: podpilot-test
  labels:
    app: web-c
    app.kubernetes.io/part-of: agentic-challenges
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-c
  template:
    metadata:
      labels:
        app: web-c
    spec:
      containers:
        - name: httpd
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "100"
              memory: 32Mi
            limits:
              cpu: "100"
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: httpd-configuration
  namespace: podpilot-test
  labels:
    app.kubernetes.io/part-of: agentic-challenges
data:
  LAB_MODE: synthetic
---
# Challenge 4: the ConfigMap name below contains a deliberate spelling error.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-d
  namespace: podpilot-test
  labels:
    app: web-d
    app.kubernetes.io/part-of: agentic-challenges
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-d
  template:
    metadata:
      labels:
        app: web-d
    spec:
      containers:
        - name: httpd
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: httpd-configuraton
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-target
  namespace: podpilot-test2
  labels:
    app: network-target
    app.kubernetes.io/part-of: agentic-challenges
spec:
  replicas: 1
  selector:
    matchLabels:
      app: network-target
  template:
    metadata:
      labels:
        app: network-target
    spec:
      containers:
        - name: httpd
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: content
              mountPath: /var/www/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: network-target-content
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: network-target-content
  namespace: podpilot-test2
  labels:
    app.kubernetes.io/part-of: agentic-challenges
data:
  index.html: Synthetic network target is reachable.
---
apiVersion: v1
kind: Service
metadata:
  name: network-target
  namespace: podpilot-test2
  labels:
    app.kubernetes.io/part-of: agentic-challenges
spec:
  selector:
    app: network-target
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Challenge 5: this policy selects the target and allows no ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: network-target-ingress
  namespace: podpilot-test2
  labels:
    app.kubernetes.io/part-of: agentic-challenges
spec:
  podSelector:
    matchLabels:
      app: network-target
  policyTypes:
    - Ingress
  ingress: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-client
  namespace: podpilot-test
  labels:
    app: network-client
    app.kubernetes.io/part-of: agentic-challenges
spec:
  replicas: 1
  selector:
    matchLabels:
      app: network-client
  template:
    metadata:
      labels:
        app: network-client
    spec:
      containers:
        - name: client
          image: quay.io/curl/curl:8.16.0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              while true; do
                curl --fail --silent --show-error --connect-timeout 2 --max-time 3 \
                  http://network-target.podpilot-test2.svc.cluster.local:8080/ >/dev/null
                sleep 5
              done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
